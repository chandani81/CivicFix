<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Complaints — CivicFix</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="app-shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>All complaints</h1>

        </div>
      </div>

      <div class="filter-row">
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>
        <select id="category-filter">
          <option value="">All categories</option>
          <option value="road_damage">Road Damage</option>
          <option value="water_leakage">Water Leakage</option>
          <option value="garbage">Garbage</option>
          <option value="street_light">Street Light</option>
          <option value="drainage">Drainage</option>
          <option value="others">Others</option>
        </select>
        <div class="chip" id="emergency-chip">Emergencies only</div>
      </div>

      <div class="complaint-list" id="complaint-list">
        <div class="empty-state">Loading complaints…</div>
      </div>
    </main>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const user = requireAuth(["admin"]);
    let emergencyOnly = false;

    if (user) {
      renderSidebar("complaints.html", user);
      loadComplaints();
    }

    document.getElementById("status-filter").addEventListener("change", loadComplaints);
    document.getElementById("category-filter").addEventListener("change", loadComplaints);
    document.getElementById("emergency-chip").addEventListener("click", (e) => {
      emergencyOnly = !emergencyOnly;
      e.target.classList.toggle("active", emergencyOnly);
      loadComplaints();
    });

    async function loadComplaints() {
      const listEl = document.getElementById("complaint-list");
      listEl.innerHTML = `<div class="empty-state">Loading…</div>`;
      try {
        const parts = [];
        const status = document.getElementById("status-filter").value;
        const category = document.getElementById("category-filter").value;
        if (status) parts.push(`status=${status}`);
        if (category) parts.push(`category=${category}`);
        if (emergencyOnly) parts.push(`is_emergency=true`);
        const query = parts.length ? `?${parts.join("&")}` : "";
        const data = await Api.listComplaints(query);
        const results = data.results || data;
        if (!results.length) {
          listEl.innerHTML = `<div class="empty-state">No complaints match these filters.</div>`;
          return;
        }
        listEl.innerHTML = results.map(renderComplaintCard).join("");
        listEl.querySelectorAll(".complaint-card").forEach((card) => {
          card.addEventListener("click", () => { window.location.href = `complaint.html?id=${card.dataset.id}`; });
        });
      } catch (err) {
        listEl.innerHTML = `<div class="empty-state">Couldn't load complaints: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderComplaintCard(c) {
      return `
      <div class="complaint-card status-${c.status} ${c.is_emergency ? "is-emergency" : ""}" data-id="${c.id}">
        <div class="cc-main">
          <div class="cc-title">${escapeHtml(c.title)}</div>
          <div class="cc-meta">#${c.id} · ${escapeHtml(c.department_name || "Unassigned")} · ${escapeHtml(c.citizen_email)} · ${timeAgo(c.created_at)}</div>
        </div>
        <div class="cc-right">
          ${c.is_emergency ? `<span class="badge-emergency">Emergency</span>` : ""}
          <span class="pill">${CATEGORY_LABELS[c.category] || c.category}</span>
          <div class="stamp small status-${c.status}">${STATUS_LABELS[c.status]}</div>
        </div>
      </div>
    `;
    }
  </script>
</body>

</html>
